# Builds the Antora site from docs/ and publishes it to GitHub Pages.
# Requires Settings > Pages > Source: "GitHub Actions".

name: Publish site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'antora-playbook.yml'
      - '.github/workflows/publish-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write       # publish to GitHub Pages
  id-token: write    # prove the deployment comes from this workflow

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build the site with Antora
        run: npx --yes antora@3 --stacktrace antora-playbook.yml

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
